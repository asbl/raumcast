name: Test and portable downloads

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish version from package.json as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAUMCAST_BROWSER: /usr/bin/google-chrome
      RAUMCAST_DEBUG: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: /usr/bin/google-chrome --version
      - run: xvfb-run -a npm run test:ui
      - run: xvfb-run -a npm run test:audit
      - name: Prepare virtual audio output
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils
          if ! pactl info >/dev/null 2>&1; then pulseaudio --start --exit-idle-time=-1; fi
          pactl load-module module-null-sink sink_name=raumcast_test
          pactl set-default-sink raumcast_test
      - run: npm run test:audio
      - name: Install Windows installer compiler
        run: sudo apt-get install -y nsis
      - run: npm run package
      - run: xvfb-run -a npm run test:package -- --browser
      - uses: actions/upload-artifact@v7
        with:
          name: portable-packages
          path: release/*
          if-no-files-found: error

  platform-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - uses: actions/download-artifact@v8
        with:
          name: portable-packages
          path: release
      - run: npm run test:package
      - name: Check Windows app window and packaged UI
        if: runner.os == 'Windows'
        run: npm run test:package -- --installer --browser

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, platform-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: portable-packages
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --title "Raumcast $VERSION" --notes-file RELEASE_NOTES.md
